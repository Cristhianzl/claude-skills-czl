name: Bug report
description: A skill, command, rule, or settings file doesn't behave as documented.
labels: ["bug"]
body:
  - type: dropdown
    id: config
    attributes:
      label: Config
      options: ["agnostic", "langflow", "both"]
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - A skill (skills/)
        - A slash command (commands/)
        - A rule (rules/)
        - CLAUDE.md baseline
        - settings.json (permissions)
        - Install / update flow
        - README or docs
    validations:
      required: true

  - type: input
    id: file
    attributes:
      label: File
      description: Repo-relative path — no absolute local paths.
      placeholder: configs/agnostic/skills/writing-tests/SKILL.md
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: What the agent did instead. Paste the relevant part of the session if it helps — redact anything private.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Project type and language, how the config was installed (copy or symlink), and the prompt or command you ran.
      value: |
        1. Project type / language:
        2. Installed via: copy / symlink
        3. Prompt or command run:
        4.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Commit of this repo
      placeholder: "git -C /path/to/claude-skills-czl rev-parse --short HEAD"
